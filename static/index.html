<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pipeline Console</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg: #0F1620;
    --panel: #16202B;
    --border: #26323F;
    --text: #E6EAEE;
    --dim: #7C8894;
    --amber: #E8A33D;
    --teal: #4FB6A8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
  }
  .mono { font-family: 'JetBrains Mono', 'Consolas', monospace; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
  }
  header .title { font-size: 15px; font-weight: 600; letter-spacing: 0.2px; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--dim); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .dot.live { background: var(--teal); box-shadow: 0 0 6px var(--teal); }
  .budget { font-size: 13px; color: var(--dim); }
  .budget b { color: var(--text); font-weight: 600; }

  main {
    display: grid;
    grid-template-columns: 1.1fr 1.3fr 1fr;
    height: calc(100% - 53px);
  }
  section { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-width: 0; }
  main section:last-child { border-right: none; }

  .panel-label {
    padding: 10px 16px;
    font-size: 12px;
    color: var(--dim);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  /* --- transcript log --- */
  #log { flex: 1; overflow-y: auto; padding: 8px 0; }
  .log-line { padding: 8px 16px; border-bottom: 1px solid #1a232e; font-size: 13px; }
  .log-time { color: var(--dim); margin-right: 10px; }
  .log-text { color: var(--text); }
  .empty-state { padding: 24px 16px; color: var(--dim); font-size: 13px; line-height: 1.6; }

  /* --- map --- */
  #map { flex: 1; }
  .map-tiles { filter: invert(90%) hue-rotate(180deg) brightness(0.95) contrast(0.9); }

  /* --- event detail --- */
  #detail { flex: 1; overflow-y: auto; padding: 16px; }
  .badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 3px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 14px;
  }
  .badge.llm { background: rgba(232,163,61,0.15); color: var(--amber); border: 1px solid rgba(232,163,61,0.4); }
  .badge.fallback { background: rgba(79,182,168,0.15); color: var(--teal); border: 1px solid rgba(79,182,168,0.4); }

  .latency-row { margin-bottom: 16px; }
  .latency-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); margin-bottom: 6px; }
  .latency-track { height: 6px; background: #1a232e; border-radius: 3px; overflow: hidden; }
  .latency-fill { height: 100%; border-radius: 3px; transition: width 0.3s ease; }
  .latency-fill.under { background: var(--teal); }
  .latency-fill.over { background: #D9705A; }

  pre#json-view {
    background: #0B1119;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 12px;
    font-size: 12px;
    line-height: 1.6;
    color: var(--text);
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <div class="title">Audio &middot; GPS Pipeline</div>
  <div class="status"><span class="dot" id="conn-dot"></span><span id="conn-text">connecting</span></div>
  <div class="budget">latency budget <b id="budget-ms">400ms</b></div>
</header>

<main>
  <section>
    <div class="panel-label">Transcript log</div>
    <div id="log"><div class="empty-state">Waiting for the first spoken event&hellip;</div></div>
  </section>

  <section>
    <div class="panel-label">Location</div>
    <div id="map"></div>
  </section>

  <section>
    <div class="panel-label">Latest event</div>
    <div id="detail">
      <div class="empty-state">No events resolved yet.</div>
    </div>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map', { zoomControl: false }).setView([17.3850, 78.4867], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    className: 'map-tiles'
  }).addTo(map);

  const marker = L.circleMarker([17.3850, 78.4867], {
    radius: 8, color: '#4FB6A8', fillColor: '#4FB6A8', fillOpacity: 0.6, weight: 2
  }).addTo(map);

  const logEl = document.getElementById('log');
  const detailEl = document.getElementById('detail');
  const dotEl = document.getElementById('conn-dot');
  const connTextEl = document.getElementById('conn-text');

  let firstEvent = true;

  function formatTime(ts) {
    const d = new Date(ts * 1000);
    return d.toLocaleTimeString('en-GB', { hour12: false });
  }

  function addLogLine(event) {
    if (firstEvent) { logEl.innerHTML = ''; firstEvent = false; }
    const line = document.createElement('div');
    line.className = 'log-line mono';
    line.innerHTML = `<span class="log-time">${formatTime(event.timestamp)}</span><span class="log-text">${event.transcript}</span>`;
    logEl.prepend(line);
    while (logEl.children.length > 50) logEl.removeChild(logEl.lastChild);
  }

  function updateDetail(event) {
    const budgetMs = 400;
    const latencyMs = event.latency_ms || 0;
    const pct = Math.min((latencyMs / budgetMs) * 100, 100);
    const isOver = latencyMs > budgetMs;

    detailEl.innerHTML = `
      <span class="badge ${event.source}">${event.source === 'llm' ? 'LLM parsed' : 'on-device fallback'}</span>
      <div class="latency-row">
        <div class="latency-label"><span>latency</span><span>${latencyMs.toFixed(0)}ms / ${budgetMs}ms</span></div>
        <div class="latency-track"><div class="latency-fill ${isOver ? 'over' : 'under'}" style="width:${pct}%"></div></div>
      </div>
      <pre id="json-view" class="mono">${JSON.stringify(event, null, 2)}</pre>
    `;
  }

  function updateMap(event) {
    if (event.lat != null && event.lon != null) {
      marker.setLatLng([event.lat, event.lon]);
      map.panTo([event.lat, event.lon]);
    }
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}/ws`);

    ws.onopen = () => { dotEl.classList.add('live'); connTextEl.textContent = 'live'; };
    ws.onclose = () => { dotEl.classList.remove('live'); connTextEl.textContent = 'disconnected'; setTimeout(connect, 1500); };
    ws.onerror = () => ws.close();

    ws.onmessage = (msg) => {
      const event = JSON.parse(msg.data);
      addLogLine(event);
      updateDetail(event);
      updateMap(event);
    };
  }

  connect();
</script>

</body>
</html>
